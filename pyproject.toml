[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "assaystone"
version = "0.23.0"
description = "Audit AI agent traces for silent failures, then gate CI and runtime with acceptance contracts."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Assaystone contributors" }]
keywords = [
    "ai",
    "agents",
    "verification",
    "evaluation",
    "mutation-testing",
    "llm",
    "audit",
    "ai-agents",
    "agent-verification",
    "claude-code",
    "codex",
    "codex-cli",
    "agent-audit",
    "llm-evaluation",
    "test-integrity",
    "acceptance-testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/yellowsand1/assaystone"
Repository = "https://github.com/yellowsand1/assaystone"
Issues = "https://github.com/yellowsand1/assaystone/issues"
Changelog = "https://github.com/yellowsand1/assaystone/blob/main/CHANGELOG.md"

[project.scripts]
assaystone = "assaystone.cli:main"

[project.optional-dependencies]
pytest = ["pytest>=7"]
crypto = ["cryptography>=42"]
dev = ["pytest>=7", "build>=1.2", "ruff>=0.9", "coverage[toml]>=7", "cryptography>=42"]

[project.entry-points.pytest11]
assaystone = "assaystone.pytest_plugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["assaystone*"]
exclude = ["*__pycache__*"]

[tool.setuptools.package-data]
assaystone = [
  "demo_data/**/*.json",
  "demo_data/**/*.jsonl",
  "demo_data/**/*.md",
  "demo_data/**/*.py",
  "demo_data/**/*.yml",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "**/__pycache__/*", "*.py[cod]", "**/*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["assaystone"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
