name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v0.3.0). Required.
        required: true
        type: string
      publish_pypi:
        description: Publish to PyPI. Disable to only create/update the GitHub release.
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: PyPI
    steps:
      - name: Validate release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::release tag must start with v (got '$tag')"; exit 1 ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Assaystone for the production gate
        run: python -m pip install ".[dev]"
      - name: Owner approval and production gate
        env:
          ASSAYSTONE_RELEASE_KEY: ${{ secrets.ASSAYSTONE_RELEASE_KEY }}
        run: |
          printf '%s\n' "$ASSAYSTONE_RELEASE_KEY" > "$RUNNER_TEMP/release.key"
          chmod 600 "$RUNNER_TEMP/release.key"
          python -m assaystone capability drill \
            --manifest .assaystone/capability.json --root .
          python -m assaystone gate \
            --manifest .assaystone/capability.json \
            --stage production --root . \
            --owner-public-key .assaystone/owner.pub \
            --audit .assaystone/release-trail.jsonl \
            --receipt .assaystone/release-receipt.json \
            --receipt-key-file "$RUNNER_TEMP/release.key" \
            --actor release
          python -m assaystone trail verify .assaystone/release-trail.jsonl
          python -m assaystone receipt verify .assaystone/release-receipt.json \
            --public-key .assaystone/release.pub \
            --commit "$GITHUB_SHA" --outcome pass
          rm -f "$RUNNER_TEMP/release.key"
      - name: Upload the release evidence
        uses: actions/upload-artifact@v4
        with:
          name: assaystone-release-evidence
          path: |
            .assaystone/release-trail.jsonl
            .assaystone/release-receipt.json
            .assaystone/drills/build-dist.json
      - name: Build
        run: |
          python -m pip install build twine
          rm -rf dist
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          notes_file=""
          if [ -f "docs/releases/${tag}.md" ]; then
            notes_file="docs/releases/${tag}.md"
          elif curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/docs/releases/${tag}.md" -o /tmp/assaystone-release-notes.md; then
            notes_file="/tmp/assaystone-release-notes.md"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ -n "$notes_file" ]; then
              gh release edit "$tag" --notes-file "$notes_file"
              echo "release $tag notes updated"
            else
              echo "release $tag already exists"
            fi
            exit 0
          fi
          if [ -n "$notes_file" ]; then
            gh release create "$tag" dist/* --title "$tag" --notes-file "$notes_file"
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
