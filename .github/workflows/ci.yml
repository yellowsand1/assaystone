name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[pytest]"
      - name: Unit and integration tests
        run: make test
      - name: End-to-end demo (audit)
        run: make demo-audit
      - name: End-to-end demo (code/test)
        run: make demo
      - name: End-to-end demo (ops/runtime)
        run: make demo-ops
      - name: End-to-end demo (acceptance plane)
        run: make demo-plane
      - name: Failure Zoo benchmark
        run: python -m assaystone benchmark failure-zoo

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check assaystone tests
      - name: Pytest collection and suite
        run: python -m pytest -q
      - name: Coverage gate
        run: |
          python -m coverage run -m unittest discover -s tests -t . >/dev/null
          python -m coverage report
      - name: Failure Zoo benchmark and scorecard drift
        run: |
          python -m assaystone benchmark failure-zoo --md /tmp/failure-zoo.md
          diff -u docs/failure-zoo.md /tmp/failure-zoo.md
      - name: Gate this repository
        env:
          ASSAYSTONE_RECEIPT_KEY: ci-self-gate
        run: |
          python -m assaystone gate \
            --manifest .assaystone/capability.json \
            --stage shadow --root . \
            --audit .assaystone/trail.jsonl \
            --receipt .assaystone/receipt.json \
            --actor ci
          python -m assaystone trail verify .assaystone/trail.jsonl
          python -m assaystone receipt verify .assaystone/receipt.json \
            --commit "$(git rev-parse HEAD)" --outcome pass
      - name: Capability status
        env:
          ASSAYSTONE_RECEIPT_KEY: ci-self-gate
        run: |
          {
            echo "## Assaystone capability status"
            echo '```'
            python -m assaystone capability status \
              --manifest .assaystone/capability.json \
              --trail .assaystone/trail.jsonl \
              --receipt .assaystone/receipt.json \
              --stage shadow
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Capability portfolio
        env:
          ASSAYSTONE_RECEIPT_KEY: ci-self-gate
        run: python -m assaystone capability list --root . --strict
      - name: Upload the gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: assaystone-self-gate
          path: |
            .assaystone/trail.jsonl
            .assaystone/receipt.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/assaystone-wheel
          /tmp/assaystone-wheel/bin/pip install dist/*.whl pytest
          /tmp/assaystone-wheel/bin/assaystone --version
      - name: Demos from the installed wheel
        run: |
          mkdir -p /tmp/assaystone-demo
          cd /tmp/assaystone-demo
          /tmp/assaystone-wheel/bin/assaystone demo audit
          /tmp/assaystone-wheel/bin/assaystone demo
          /tmp/assaystone-wheel/bin/assaystone demo ops
          /tmp/assaystone-wheel/bin/assaystone demo plane --output-dir /tmp/assaystone-demo
          /tmp/assaystone-wheel/bin/assaystone benchmark failure-zoo

  action-gate:
    runs-on: ubuntu-latest
    env:
      ASSAYSTONE_RECEIPT_KEY: ci-action-key
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: gate
        with:
          install: "."
          manifest: examples/capability/pricing.json
          stage: shadow
          root: examples/capability/pricing_project
          audit: /tmp/assaystone-action-trail.jsonl
          actor: ci
          receipt: /tmp/assaystone-action-receipt.json
      - name: Gate outputs, receipt, and trail
        run: |
          test "${{ steps.gate.outputs.verdict }}" = "pass"
          test "${{ steps.gate.outputs.findings }}" = "0"
          assaystone trail verify /tmp/assaystone-action-trail.jsonl
          assaystone receipt verify /tmp/assaystone-action-receipt.json \
            --commit "$GITHUB_SHA" --outcome pass
