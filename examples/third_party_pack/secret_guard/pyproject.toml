[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assaystone-secret-guard"
version = "0.1.0"
description = "Example secret-scanning verifier pack for Assaystone"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."assaystone.verifiers"]
secret_guard = "secret_guard.verifiers"

[tool.setuptools.packages.find]
include = ["secret_guard*"]
